[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "content-recognition-platform"
version = "0.1.0"
description = "Distributed TV and OTT content recognition platform for Raspberry Pi edge devices."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "sqlalchemy>=2.0.31",
  "psycopg[binary]>=3.2.1",
  "httpx>=0.27.0",
  "numpy>=1.26.4",
  "paramiko>=3.4.0",
  "python-multipart>=0.0.9",
  "qdrant-client>=1.9.0",
  "librosa>=0.10.1",
  "mediapipe>=0.10.3",
  "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.5.0",
]
pi = [
  "opencv-python>=4.10.0.84",
  "pytesseract>=0.3.13",
  "Pillow>=10.4.0",
]

[project.scripts]
crp-server = "content_platform.server.main:run"
crp-edge = "content_platform.edge.main:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
