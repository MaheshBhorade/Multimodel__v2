services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: crp
      POSTGRES_USER: crp
      POSTGRES_PASSWORD: crp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
